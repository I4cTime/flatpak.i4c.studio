# ProtonShift - I4C Flatpak repo manifest.
#
# A copy of protonshift's flatpak/flathub/io.github.i4ctime.protonshift.yml
# (offline build: KDE runtime + PySide BaseApp, vendored vdf) with one
# addition, `default-branch: stable`, so flatter publishes the stable ref.
# On each ProtonShift release, re-copy that file from the release commit and
# keep the line below; the `commit:` pin is the release commit.
app-id: io.github.i4ctime.protonshift
default-branch: stable
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: "6.11"
command: protonshift

finish-args:
  # --device=input needs flatpak >= 1.16
  - --require-version=1.16.0
  - --share=ipc
  # GE-Proton downloads (GitHub releases) and ProtonDB rating lookups.
  # Both are user-initiated / opt-out; nothing else talks to the network.
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  # Interface sounds (Settings, Sounds); playback only.
  - --socket=pulseaudio
  - --device=dri
  # Read-only view of the host's /usr (at /run/host/usr), to list Proton
  # builds a distro package installed system-wide, e.g.
  # /usr/share/steam/compatibilitytools.d/proton-ge-custom.
  - --filesystem=host-os:ro
  # game controllers (gamepad tester)
  - --device=input
  # ProtonShift writes only the specific config dirs below. Steam/Heroic in
  # their default locations are covered by the grants further down; a custom
  # library folder elsewhere needs a user override (Flatseal or
  # `flatpak override --filesystem=`). Save-backup restores to arbitrary
  # paths go through the file portal.
  - --filesystem=~/.config/protonshift:create
  - --filesystem=~/.config/scopebuddy:create
  - --filesystem=~/.config/MangoHud:create
  - --filesystem=~/.config/environment.d:create
  # env-var targets for desktops systemd does not start (#47): managed block
  # in the login profile / X session rc
  - --filesystem=~/.profile:create
  - --filesystem=~/.xsessionrc:create
  # default target dir for save-backup restores
  - --filesystem=~/ProtonShift Restores:create
  - --filesystem=~/.steam
  - --filesystem=~/.local/share/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  - --filesystem=~/.config/heroic
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl
  # Lutris library (pga.db + games/*.yml), read only
  - --filesystem=~/.local/share/lutris:ro
  - --filesystem=~/.var/app/net.lutris.Lutris:ro
  # Host tool detection and launch (gamescope, mangohud, protontricks) and
  # display enumeration (wlr-randr) run on the host via `flatpak-spawn --host`.
  # Core functionality - linter exception requested in the submission PR;
  # precedent: io.github.dvlv.boxbuddyrs ("Requires use of Distrobox on the
  # host"). Steam/Heroic appdata rw precedent: com.github.Matoking.protontricks.
  - --talk-name=org.freedesktop.Flatpak

# The PySide BaseApp stages PySide6 under /app/lib; keep it on the path.
build-options:
  env:
    PYTHONPATH: /app/lib/python3/dist-packages

cleanup-commands:
  # BaseApp ships the whole Qt binding; drop the dev bits we don't ship.
  - rm -rf /app/lib/python3/dist-packages/PySide6/examples || true

modules:
  # vdf - pure-Python, vendored as a pinned wheel (see gen-vendor.sh).
  - python3-vdf.yaml

  - name: protonshift
    buildsystem: simple
    build-commands:
      # Deps already present (PySide6 from the BaseApp, vdf vendored above);
      # install just our package, no index, no build isolation.
      - pip3 install --prefix=${FLATPAK_DEST} --no-index --no-build-isolation
          --no-warn-script-location .
      - install -Dm644 flatpak/io.github.i4ctime.protonshift.desktop
          ${FLATPAK_DEST}/share/applications/io.github.i4ctime.protonshift.desktop
      - install -Dm644 flatpak/io.github.i4ctime.protonshift.metainfo.xml
          ${FLATPAK_DEST}/share/metainfo/io.github.i4ctime.protonshift.metainfo.xml
      - install -Dm644 flatpak/icons/io.github.i4ctime.protonshift-256.png
          ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/io.github.i4ctime.protonshift.png
      - install -Dm644 flatpak/icons/io.github.i4ctime.protonshift-128.png
          ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/io.github.i4ctime.protonshift.png
      - install -Dm644 flatpak/icons/io.github.i4ctime.protonshift-64.png
          ${FLATPAK_DEST}/share/icons/hicolor/64x64/apps/io.github.i4ctime.protonshift.png
    sources:
      # Pinned to the v1.3.2 release commit on main.
      # Bump `commit:` to the release commit before each flathub update PR.
      - type: git
        url: https://github.com/I4cTime/protonshift.git
        commit: 0d7263d72baab57b6bf25fcab4208914524c6c7f
